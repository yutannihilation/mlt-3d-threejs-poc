catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Do not resolve versions published less than 7 days ago (minutes).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # 0.2.1 was published less than 7 days before it was adopted.
  - "@maplibre/mlt-wasm"
  # The Vite+ toolchain the project was scaffolded with.
  - vite-plus
  - "@voidzero-dev/*"
  # Exact-pinned dependencies of vite-plus, released alongside it.
  - oxlint
  - oxfmt
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxc-project/*"
  - tsrs
  - "@tsrs/*"
